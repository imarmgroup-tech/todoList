<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Todo App + Telegram Bot</title>
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- ไฟล์ CSS แยก (ถ้ามี) -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

    <!-- ส่วนเนื้อหาเว็บไซต์ (UI Containers ต่างๆ ตามโค้ดเดิมของคุณ) -->
    <div class="max-w-4xl mx-auto p-4 space-y-6">
        <!-- ตัวอย่าง Header แสดงสถานะ -->
        <div class="flex justify-between items-center">
            <h1 class="text-xl font-bold">Todo List & Telegram Bot</h1>
            <div class="flex items-center gap-2">
                <span id="db-status-dot" class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
                <span id="db-status-text" class="text-slate-400 text-sm">กำลังเชื่อมต่อ...</span>
            </div>
        </div>

        <!-- พื้นที่แสดงรายการ Task -->
        <div id="tasks-container" class="space-y-3">
            <!-- รายการงานจะถูกเรนเดอร์ตรงนี้ด้วย JavaScript -->
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 space-y-2 pointer-events-none"></div>

    <!-- โหลดไฟล์ JavaScript หลักแยกออกมา -->
    <script src="app.js"></script>
</body>
</html>
