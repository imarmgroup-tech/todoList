<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Todo App + Telegram Bot</title>
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

    <div class="max-w-4xl mx-auto p-4 sm:p-6 space-y-6">
        <!-- Header -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-xl font-bold flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-rose-500">></i> Todo List & Telegram Bot
                </h1>
                <p id="current-date-str" class="text-xs text-slate-400 mt-1"></p>
            </div>
            
            <!-- Connection Status Badge -->
            <div class="flex items-center gap-2 bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-full">
                <span id="db-status-dot" class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                <span id="db-status-text" class="text-emerald-400 text-xs font-medium">Supabase Connected</span>
            </div>
        </div>

        <!-- Add Task Form -->
        <form onsubmit="handleAddTask(event)" class="glass-panel rounded-2xl p-4 space-y-3">
            <div class="flex gap-2">
                <input type="text" id="task-title" placeholder="ระบุงานที่จะต้องทำ... (เช่น ส่งสรุปงบประมาณ #high @14:30 #Work)" 
                    class="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-xs sm:text-sm text-slate-100 focus:outline-none focus:border-rose-500 transition" required>
                <button type="submit" class="bg-rose-600 hover:bg-rose-500 text-white px-5 py-2.5 rounded-xl text-xs sm:text-sm font-medium transition flex items-center gap-2 cursor-pointer shadow-lg shadow-rose-600/20">
                    <i class="fa-solid fa-plus"></i> เพิ่มงาน
                </button>
            </div>
        </form>

        <!-- Filter & Actions -->
        <div class="flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-1.5 bg-slate-900/80 p-1 rounded-xl border border-slate-800 text-xs">
                <button onclick="setFilter('all')" id="filter-all" class="filter-btn bg-rose-600 text-white px-3 py-1.5 rounded-lg font-medium transition">ทั้งหมด (<span id="count-all">0</span>)</button>
                <button onclick="setFilter('pending')" id="filter-pending" class="filter-btn text-slate-400 hover:text-slate-200 px-3 py-1.5 rounded-lg font-medium transition">รอดำเนินการ (<span id="count-pending">0</span>)</button>
                <button onclick="setFilter('completed')" id="filter-completed" class="filter-btn text-slate-400 hover:text-slate-200 px-3 py-1.5 rounded-lg font-medium transition">เสร็จแล้ว (<span id="count-completed">0</span>)</button>
            </div>
        </div>

        <!-- Tasks List Container -->
        <div id="tasks-container" class="space-y-3">
            <!-- รายการงานจะแสดงที่นี่ -->
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 space-y-2 pointer-events-none"></div>

    <!-- Main Logic Script -->
    <script src="app.js"></script>
</body>
</html>
