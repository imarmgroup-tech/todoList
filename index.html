<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Todo App + Telegram Bot & Auth</title>
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="p-3 sm:p-6">

    <!-- Auth View (หน้าจอล็อกอิน / สมัครสมาชิก) -->
    <div id="auth-container" class="max-w-md mx-auto my-12 glass-panel p-6 rounded-2xl space-y-6">
        <div class="text-center space-y-2">
            <h2 class="text-xl font-bold flex items-center justify-center gap-2">
                <i class="fa-solid fa-user-lock text-rose-500"></i> เข้าสู่ระบบ / สมัครสมาชิก
            </h2>
            <p class="text-xs text-slate-400">เข้าสู่ระบบเพื่อจัดการงานส่วนตัวและซิงค์ข้อมูลกับ Telegram</p>
        </div>

        <form onsubmit="handleAuth(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">อีเมล</label>
                <input type="email" id="auth-email" placeholder="name@example.com" class="w-full rounded-xl px-4 py-2.5 text-xs" required>
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">รหัสผ่าน</label>
                <input type="password" id="auth-password" placeholder="••••••••" class="w-full rounded-xl px-4 py-2.5 text-xs" required>
            </div>
            
            <div class="flex gap-2 pt-2">
                <button type="submit" onclick="setAuthMode('login')" class="flex-1 bg-rose-600 hover:bg-rose-500 text-white py-2.5 rounded-xl text-xs font-semibold transition cursor-pointer">
                    เข้าสู่ระบบ
                </button>
                <button type="submit" onclick="setAuthMode('signup')" class="flex-1 bg-slate-900 border border-slate-800 hover:bg-slate-800 text-slate-200 py-2.5 rounded-xl text-xs font-semibold transition cursor-pointer">
                    สมัครสมาชิก
                </button>
            </div>
        </form>
    </div>

    <!-- Main App View (หน้าจอแอปหลัก - จะแสดงเมื่อล็อกอินแล้ว) -->
    <div id="app-container" class="hidden max-w-4xl mx-auto space-y-6">
        <!-- Header -->
        <div class="glass-panel p-5 rounded-2xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
                <h1 class="text-base sm:text-lg font-bold flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-rose-500"></i> Todo & Telegram Bot + Calendar
                </h1>
                <p id="current-date-str" class="text-xs text-slate-400 mt-1"></p>
            </div>
            
            <div class="flex items-center gap-3">
                <div class="text-right">
                    <p id="user-email-display" class="text-xs font-semibold text-rose-400"></p>
                    <span id="db-status-text" class="text-[10px] text-emerald-400 font-medium">Supabase Connected</span>
                </div>
                <button onclick="handleLogout()" class="bg-slate-900 border border-slate-800 hover:border-rose-500/50 hover:text-rose-400 px-3 py-1.5 rounded-xl text-xs font-medium text-slate-300 transition flex items-center gap-1.5 cursor-pointer">
                    <i class="fa-solid fa-right-from-bracket"></i> ออกจากระบบ
                </button>
            </div>
        </div>

        <!-- Progress & Analytics -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="glass-panel p-4 rounded-2xl space-y-2">
                <div class="flex justify-between text-xs text-slate-400">
                    <span>ความคืบหน้ารวม</span>
                    <span id="header-progress-text" class="font-bold text-rose-400">0%</span>
                </div>
                <div class="w-full bg-slate-900 h-2 rounded-full overflow-hidden">
                    <div id="header-progress-bar" class="bg-gradient-to-r from-rose-600 to-pink-500 h-full w-0 transition-all duration-500"></div>
                </div>
            </div>
            <div class="glass-panel p-4 rounded-2xl flex justify-between items-center">
                <div>
                    <p class="text-xs text-slate-400">งานทั้งหมด / เสร็จแล้ว</p>
                    <h3 class="text-lg font-bold text-slate-100 mt-0.5"><span id="stat-total">0</span> / <span id="stat-completed" class="text-emerald-400">0</span></h3>
                </div>
                <div class="w-10 h-10 rounded-xl bg-rose-500/10 border border-rose-500/20 flex items-center justify-center text-rose-400">
                    <i class="fa-solid fa-chart-pie"></i>
                </div>
            </div>
            <div class="glass-panel p-4 rounded-2xl flex items-center justify-between">
                <div>
                    <p class="text-xs text-slate-400">ตัวกรองด่วน</p>
                    <div class="flex gap-1 mt-1">
                        <button onclick="setFilter('all')" id="filter-all" class="filter-btn bg-rose-600 text-white px-2.5 py-1 rounded-lg text-xs font-medium transition">ทั้งหมด (<span id="count-all">0</span>)</button>
                        <button onclick="setFilter('pending')" id="filter-pending" class="filter-btn text-slate-400 hover:text-slate-200 px-2.5 py-1 rounded-lg text-xs font-medium transition">ค้าง (<span id="count-pending">0</span>)</button>
                        <button onclick="setFilter('completed')" id="filter-completed" class="filter-btn text-slate-400 hover:text-slate-200 px-2.5 py-1 rounded-lg text-xs font-medium transition">เสร็จ (<span id="count-completed">0</span>)</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Add Task Form -->
        <form onsubmit="handleAddTask(event)" class="glass-panel rounded-2xl p-4 space-y-3">
            <div class="flex flex-col sm:flex-row gap-2">
                <input type="text" id="task-title" placeholder="ระบุงานที่จะต้องทำ... (#high @14:30 @2026-10-31 #Work)" 
                    class="flex-1 rounded-xl px-4 py-2.5 text-xs text-slate-100 focus:outline-none" required>
                <select id="task-priority" class="rounded-xl px-3 py-2.5 text-xs text-slate-300">
                    <option value="medium">Medium (ปานกลาง)</option>
                    <option value="high">High (สูง)</option>
                    <option value="low">Low (ต่ำ)</option>
                </select>
            </div>
            <div class="flex flex-wrap items-center justify-between gap-2">
                <div class="flex items-center gap-2">
                    <input type="text" id="task-category" placeholder="หมวดหมู่" value="Work" class="w-32 rounded-xl px-3 py-2 text-xs text-slate-300">
                    <input type="date" id="task-due-date" class="rounded-xl px-3 py-2 text-xs text-slate-300">
                    <input type="time" id="task-due-time" class="rounded-xl px-3 py-2 text-xs text-slate-300">
                </div>
                <div class="flex items-center gap-2">
                    <label class="flex items-center gap-1.5 text-xs text-slate-300 cursor-pointer bg-slate-900/80 px-3 py-2 rounded-xl border border-slate-800">
                        <input type="checkbox" id="task-is-routine" class="w-3.5 h-3.5 rounded border-slate-700 bg-slate-900 text-rose-600 accent-rose-500">
                        <i class="fa-solid fa-repeat text-rose-400"></i> เป็นงานประจำวัน (Routine)
                    </label>
                    <button type="submit" class="bg-rose-600 hover:bg-rose-500 text-white px-5 py-2 rounded-xl text-xs font-medium transition flex items-center gap-2 shadow-lg shadow-rose-600/20 cursor-pointer">
                        <i class="fa-solid fa-plus"></i> เพิ่มงาน
                    </button>
                </div>
            </div>
        </form>

        <!-- Sort & Extra Views -->
        <div class="flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-2">
                <span class="text-xs text-slate-400">เรียงลำดับ:</span>
                <select id="sort-select" onchange="renderTasks()" class="rounded-xl px-3 py-1.5 text-xs text-slate-300">
                    <option value="latest">ล่าสุด</option>
                    <option value="due_date">วันที่ส่งงานใกล้สุด</option>
                    <option value="priority">ความสำคัญสูงสุด</option>
                </select>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="setFilter('routine')" id="filter-routine" class="filter-btn bg-slate-900 border border-slate-800 text-slate-300 hover:text-white px-3 py-1.5 rounded-xl text-xs font-medium transition cursor-pointer">
                    <i class="fa-solid fa-repeat text-rose-400"></i> งานประจำวัน
                </button>
                <button onclick="toggleModal('telegram-sim-modal')" class="bg-sky-500/10 border border-sky-500/20 text-sky-400 hover:bg-sky-500/20 px-3 py-1.5 rounded-xl text-xs font-medium transition flex items-center gap-1.5 cursor-pointer">
                    <i class="fa-brands fa-telegram"></i> จำลอง Telegram Bot
                </button>
            </div>
        </div>

        <!-- Tasks List Container -->
        <div id="tasks-container" class="space-y-3"></div>
    </div>

    <!-- Modals -->
    <!-- Edit Task Modal -->
    <div id="edit-task-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-4">
        <div class="glass-panel w-full max-w-md rounded-2xl p-6 space-y-4 border border-slate-700 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="text-sm font-bold text-slate-100 flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-rose-500"></i> แก้ไขรายการงาน
                </h3>
                <button onclick="toggleModal('edit-task-modal')" class="text-slate-400 hover:text-slate-200"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>
            <input type="hidden" id="edit-task-id">
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">หัวข้องาน</label>
                    <input type="text" id="edit-task-title" class="w-full rounded-xl px-3 py-2 text-xs text-slate-100">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">ความสำคัญ</label>
                        <select id="edit-task-priority" class="w-full rounded-xl px-3 py-2 text-xs text-slate-100">
                            <option value="high">High (สูง)</option>
                            <option value="medium">Medium (ปานกลาง)</option>
                            <option value="low">Low (ต่ำ)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">วันที่ส่งงาน</label>
                        <input type="date" id="edit-task-due-date" class="w-full rounded-xl px-3 py-2 text-xs text-slate-100">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">เวลา</label>
                        <input type="time" id="edit-task-due-time" class="w-full rounded-xl px-3 py-2 text-xs text-slate-100">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">สถานะงานประจำ</label>
                        <label class="flex items-center gap-2 mt-2 text-xs text-slate-300 cursor-pointer">
                            <input type="checkbox" id="edit-task-is-routine" class="w-4 h-4 rounded border-slate-700 bg-slate-900 text-rose-600 accent-rose-500"> งานประจำวัน
                        </label>
                    </div>
                </div>
            </div>
            <div class="flex justify-end gap-2 pt-2 border-t border-slate-800">
                <button type="button" onclick="toggleModal('edit-task-modal')" class="px-4 py-2 rounded-xl text-xs font-medium text-slate-400 bg-slate-900 border border-slate-800">ยกเลิก</button>
                <button type="button" onclick="saveEditTask()" class="px-5 py-2 rounded-xl text-xs font-medium text-white bg-rose-600 hover:bg-rose-500">บันทึก</button>
            </div>
        </div>
    </div>

    <!-- Telegram Simulator Modal -->
    <div id="telegram-sim-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-4">
        <div class="glass-panel w-full max-w-lg rounded-2xl p-6 space-y-4 border border-slate-700 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="text-sm font-bold text-slate-100 flex items-center gap-2">
                    <i class="fa-brands fa-telegram text-sky-400"></i> จำลองข้อความจาก Telegram Bot
                </h3>
                <button onclick="toggleModal('telegram-sim-modal')" class="text-slate-400 hover:text-slate-200"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>
            <form onsubmit="handleSimulateTelegram(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">พิมพ์ข้อความสั่งการ:</label>
                    <input type="text" id="sim-input-text" placeholder="/add ประชุมทีมงาน #high @14:30 @2026-11-01 #Work" class="w-full rounded-xl px-3 py-2.5 text-xs text-slate-100" required>
                </div>
                <div class="flex justify-end gap-2 pt-2 border-t border-slate-800">
                    <button type="submit" class="px-5 py-2 rounded-xl text-xs font-medium text-white bg-sky-600 hover:bg-sky-500">จำลองการส่งข้อความ</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast-container" class="fixed bottom-4 right-4 z-50 space-y-2 pointer-events-none"></div>

    <script src="app.js"></script>
</body>
</html>
